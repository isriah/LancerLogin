name: Build community release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  verify-and-release:
    # Disabled in the modular development repository; see docs/MODULAR-DEVELOPMENT.md.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version=$(jq -r .version package.json)
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Require successful main-branch verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          successful_runs=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')
          test "$successful_runs" -gt 0 || {
            echo "The tagged commit must first pass the Verify workflow on main." >&2
            exit 1
          }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Package and validate both kiosk release archives
        run: sudo "$(command -v node)" scripts/package-kiosk.mjs release/artifacts --require-unprivileged
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes_file" || { echo "Missing required meaningful patch notes: $notes_file" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/artifacts/* --verify-tag --notes-file "$notes_file" --title "LancerLogin $GITHUB_REF_NAME"
