name: Verify
on:
  pull_request:
  push:
    branches: [main, modular]
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:
env:
  # Verification builds the dashboard and API without composing plugins. Installation and update builds compose them,
  # and the prebuild guard (scripts/check-module-composition.mjs) refuses any other CI build without composition.
  LANCERLOGIN_PLUGIN_FREE_BUILD: "1"
jobs:
  actionlint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1, cache: npm }
      - run: npm ci --no-audit
      - name: Check that selectable installation releases contain the files the installer runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-provision-release-compat.mjs
      - name: Select verification scope
        id: verification-scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          full=false
          kiosk=false
          reason="scoped change"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            full=true
            reason="manual complete verification"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$HEAD_COMMIT_MESSAGE" == Release\ v* ]]; then
            full=true
            reason="exact release commit"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            full=true
            reason="new branch history"
          fi

          if [[ "$full" == "true" ]]; then
            kiosk=true
          else
            changed_files="$RUNNER_TEMP/changed-files.txt"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
            elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
            else
              : > "$changed_files"
            fi

            while IFS= read -r file; do
              case "$file" in
                apps/kiosk/*|packages/shared/*|scripts/package-kiosk.mjs|scripts/install-kiosk.sh|tests/kiosk-runtime.test.mjs|tests/kiosk-artifacts.test.mjs|package.json|package-lock.json)
                  kiosk=true
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "kiosk=$kiosk" >> "$GITHUB_OUTPUT"
          echo "Verification scope: $reason (full=$full, kiosk=$kiosk)"
      - name: Verify root-owned kiosk artifacts as an unprivileged service account
        if: steps.verification-scope.outputs.full == 'true'
        run: sudo "$(command -v node)" --test tests/kiosk-artifacts.test.mjs
      - name: Run complete release verification once
        if: steps.verification-scope.outputs.full == 'true'
        env:
          # Optional read access for private plugin repositories pinned by scripts/official-modules.json and tests/fixtures.
          # The test harness fetches public pins anonymously and sends this token only when it is set.
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
        run: npm run verify:release-ci
      - name: Run web-scoped verification
        if: steps.verification-scope.outputs.full != 'true'
        env:
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
        run: npm run verify:dev
      - name: Run affected kiosk verification
        if: steps.verification-scope.outputs.full != 'true' && steps.verification-scope.outputs.kiosk == 'true'
        run: npm run verify:kiosk
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Select dependency-audit runs
        id: audit-policy
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run_audit=false
          reason="ordinary change"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            run_audit=true
            reason="scheduled default-branch audit"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_audit=true
            reason="manual exact-commit audit"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$HEAD_COMMIT_MESSAGE" == Release\ v* ]]; then
            run_audit=true
            reason="release candidate"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            run_audit=true
            reason="new branch history"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- package.json package-lock.json ':(glob)**/package.json' ':(glob)**/package-lock.json'; then
            run_audit=true
            reason="dependency manifest changed"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- package.json package-lock.json ':(glob)**/package.json' ':(glob)**/package-lock.json'; then
            run_audit=true
            reason="dependency manifest changed"
          fi
          echo "run=$run_audit" >> "$GITHUB_OUTPUT"
          echo "Dependency audit policy: $reason (run=$run_audit)"
      - uses: actions/setup-node@v7
        if: steps.audit-policy.outputs.run == 'true'
        with: { node-version: 24.22.1, cache: npm }
      - name: Materialize the audited dependency tree without lifecycle scripts
        if: steps.audit-policy.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit
      - name: Audit the complete dependency lockfile
        if: steps.audit-policy.outputs.run == 'true'
        run: npm run audit:release
  core-browser-shard:
    # The release-gate browser suite runs in three groups from tests-browser/groups.json (scripts/browser-groups.mjs).
    # Core: every core and integration spec, plugin-free. Each part is a set of whole spec files balanced by measured time.
    # The dashboard is served by the Vite dev server from this checkout, so there is no prebuilt build to share.
    name: Core browser shard ${{ matrix.shard }}/4
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-latest
    # Setup on a slow runner must not cancel passing tests; the test step keeps its own limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1, cache: npm }
      - run: npm ci --no-audit
      - name: Read the locked Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser for this Playwright version
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install the Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run this core browser shard
        timeout-minutes: 15
        run: npm run test:browser -- --group core --part ${{ matrix.shard }}/4
  plugin-browser-shard:
    # Plugin: the specs that need the official Outreach or Carpool plugin, with both composed. Composition fails the job,
    # rather than skipping, when a pin is unreadable, and the runner refuses this group without composition.
    name: Plugin browser shard ${{ matrix.shard }}/1
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1, cache: npm }
      - run: npm ci --no-audit
      - name: Read the locked Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser for this Playwright version
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install the Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run this plugin browser shard
        timeout-minutes: 15
        env:
          # Optional read access for private plugin repositories pinned by scripts/official-modules.json and tests/fixtures.
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
        run: npm run test:browser -- --group plugin --compose-selection tests/fixtures/carpool.modules.json --part ${{ matrix.shard }}/1
  integration-browser-shard:
    # Integration: the Core specs whose behaviour changes when plugins exist (module navigation, Settings > Modules and
    # plugin management, module setup, backup and restore, shell and startup), again with the plugins composed.
    name: Integration browser shard ${{ matrix.shard }}/1
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1, cache: npm }
      - run: npm ci --no-audit
      - name: Read the locked Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser for this Playwright version
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install the Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies for the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run this integration browser shard
        timeout-minutes: 15
        env:
          # Optional read access for private plugin repositories pinned by scripts/official-modules.json and tests/fixtures.
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
        run: npm run test:browser -- --group integration --compose-selection tests/fixtures/carpool.modules.json --part ${{ matrix.shard }}/1
  browser-smoke:
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')))
    needs: [core-browser-shard, plugin-browser-shard, integration-browser-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every core, plugin and integration browser shard to pass
        env:
          CORE_SHARD_RESULT: ${{ needs.core-browser-shard.result }}
          PLUGIN_SHARD_RESULT: ${{ needs.plugin-browser-shard.result }}
          INTEGRATION_SHARD_RESULT: ${{ needs.integration-browser-shard.result }}
        run: |
          test "$CORE_SHARD_RESULT" = success
          test "$PLUGIN_SHARD_RESULT" = success
          test "$INTEGRATION_SHARD_RESULT" = success
