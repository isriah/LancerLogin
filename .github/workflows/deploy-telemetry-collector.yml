name: Deploy community telemetry collector

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create the fresh collector or resume an interrupted deployment
        required: true
        default: create
        type: choice
        options:
          - create
          - resume
      confirmation:
        description: Type CREATE LANCERLOGIN TELEMETRY or RESUME LANCERLOGIN TELEMETRY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lancerlogin-community-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: telemetry-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.LANCERLOGIN_TELEMETRY_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.LANCERLOGIN_TELEMETRY_CLOUDFLARE_ACCOUNT_ID }}
      INSTALL_ID_PEPPER: ${{ secrets.LANCERLOGIN_TELEMETRY_INSTALL_PEPPER }}
      ADMIN_BEARER_TOKEN: ${{ secrets.LANCERLOGIN_TELEMETRY_ADMIN_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate explicit confirmation and dedicated secret
        shell: bash
        run: |
          expected=$(echo "${{ inputs.operation }} LANCERLOGIN TELEMETRY" | tr '[:lower:]' '[:upper:]')
          test "${{ inputs.confirmation }}" = "$expected"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$CLOUDFLARE_API_TOKEN" in cfat_*) ;; *) echo "Expected a Cloudflare account-owned API token" >&2; exit 1;; esac
          test "${#CLOUDFLARE_ACCOUNT_ID}" = 32
          test "${#INSTALL_ID_PEPPER}" -ge 32
          test "${#ADMIN_BEARER_TOKEN}" -ge 32
      - run: npm ci
      - name: Verify the scoped token and collector account
        shell: bash
        run: |
          mkdir -p .collector
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output .collector/token.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$status" != "200" ]; then
            # shellcheck disable=SC2016 -- JavaScript expands this template literal, not Bash.
            node -e 'const d=require("./.collector/token.json"); console.error(`Cloudflare account-token verification failed (HTTP ${process.argv[1]}; codes: ${(d.errors||[]).map(e=>e.code).join(",")||"none"})`)' "$status"
            exit 1
          fi
          node -e 'const d=require("./.collector/token.json"); if(d.success!==true||d.result?.status!=="active") process.exit(1)'
      - name: Discover dedicated collector resources
        id: resources
        shell: bash
        run: |
          npx wrangler d1 list --json > .collector/d1-list.json
          database=$(node scripts/prepare-telemetry-collector.mjs .collector/d1-list.json)
          if npx wrangler deployments list --name lancerlogin-community-telemetry --json > .collector/worker-deployments.json 2>/dev/null; then worker=exists; else worker=missing; fi
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.operation }}" = "create" ]; then
            test "$database" = "missing"
            test "$worker" = "missing"
          else
            test "$database" = "exists"
          fi
      - name: Create dedicated D1 database
        if: inputs.operation == 'create'
        shell: bash
        run: |
          npx wrangler d1 create lancerlogin-community-telemetry --binding DB --update-config --config .collector/wrangler.json
          npx wrangler d1 list --json > .collector/d1-list.json
          test "$(node scripts/prepare-telemetry-collector.mjs .collector/d1-list.json)" = "exists"
      - name: Apply collector migrations
        run: npx wrangler d1 migrations apply lancerlogin-community-telemetry --remote --config .collector/wrangler.json
      - name: Deploy new collector with configured collector-only secrets
        if: steps.resources.outputs.worker == 'missing'
        id: deploy-new
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.LANCERLOGIN_TELEMETRY_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .collector
          preCommands: npx wrangler deploy
          command: deploy
          secrets: |
            INSTALL_ID_PEPPER
            ADMIN_BEARER_TOKEN
        env:
          INSTALL_ID_PEPPER: ${{ secrets.LANCERLOGIN_TELEMETRY_INSTALL_PEPPER }}
          ADMIN_BEARER_TOKEN: ${{ secrets.LANCERLOGIN_TELEMETRY_ADMIN_TOKEN }}
      - name: Deploy existing collector with retained secret values
        if: steps.resources.outputs.worker == 'exists'
        id: deploy-existing
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.LANCERLOGIN_TELEMETRY_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .collector
          command: deploy
          secrets: |
            INSTALL_ID_PEPPER
            ADMIN_BEARER_TOKEN
        env:
          INSTALL_ID_PEPPER: ${{ secrets.LANCERLOGIN_TELEMETRY_INSTALL_PEPPER }}
          ADMIN_BEARER_TOKEN: ${{ secrets.LANCERLOGIN_TELEMETRY_ADMIN_TOKEN }}
      - name: Select and verify collector URL
        id: collector
        shell: bash
        env:
          NEW_URL: ${{ steps.deploy-new.outputs.deployment-url }}
          EXISTING_URL: ${{ steps.deploy-existing.outputs.deployment-url }}
        run: |
          base_url="${NEW_URL:-$EXISTING_URL}"
          test -n "$base_url"
          health=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$base_url/health")
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true||body.service!=="lancerlogin-telemetry-collector") process.exit(1)' "$health"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
      - name: Exercise and remove a mock report
        shell: bash
        env:
          COLLECTOR_URL: ${{ steps.collector.outputs.base-url }}
        run: |
          mock_id=$(node -e 'process.stdout.write(crypto.randomUUID())')
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header 'Content-Type: application/json' \
            --data "{\"installId\":\"$mock_id\",\"releaseVersion\":\"0.3.0\",\"activeKioskCount\":0}" \
            "$COLLECTOR_URL/v1/report"
          summary=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
            "$COLLECTOR_URL/v1/summary")
          node -e 'const body=JSON.parse(process.argv[1]); if(body.retentionDays!==30||body.totals.uniqueInstallations<1) process.exit(1)' "$summary"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $ADMIN_BEARER_TOKEN" \
            --data "{\"installId\":\"$mock_id\"}" \
            "$COLLECTOR_URL/v1/admin/delete-installation"
      - name: Publish deployment result
        shell: bash
        env:
          COLLECTOR_URL: ${{ steps.collector.outputs.base-url }}
        run: |
          {
            echo "## LancerLogin telemetry collector ready"
            echo ""
            echo "- Health: $COLLECTOR_URL/health"
            echo "- Adopter report endpoint: $COLLECTOR_URL/v1/report"
            echo "- Retention: 30 days"
            echo ""
            echo "This deployment verified health, submitted one synthetic report, checked authenticated aggregates, and deleted the synthetic report. Adopter releases activate the reviewed public endpoint separately."
          } >> "$GITHUB_STEP_SUMMARY"
