name: Install or upgrade LancerLogin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create, resume an interrupted setup, or upgrade an existing installation
        required: true
        default: create
        type: choice
        options:
          - create
          - resume
          - upgrade
      installation_slug:
        description: Lowercase installation slug, for example example-club
        required: true
        type: string
      confirmation:
        description: Type CREATE, RESUME, or UPGRADE followed by a space and the installation slug
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provision-${{ inputs.installation_slug }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate explicit confirmation and secret
        shell: bash
        run: |
          expected=$(echo "${{ inputs.operation }}" | tr '[:lower:]' '[:upper:]')
          test "${{ inputs.confirmation }}" = "$expected ${{ inputs.installation_slug }}"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$CLOUDFLARE_API_TOKEN" in cfat_*) ;; *) echo "Expected a Cloudflare account-owned API token" >&2; exit 1;; esac
          test "${#CLOUDFLARE_ACCOUNT_ID}" = 32
      - run: npm ci
      - name: Verify the scoped token and selected Cloudflare account
        shell: bash
        run: |
          mkdir -p .provision
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output .provision/token.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$status" != "200" ]; then
            node -e 'const d=require("./.provision/token.json"); console.error(`Cloudflare account-token verification failed (HTTP ${process.argv[1]}; codes: ${(d.errors||[]).map(e=>e.code).join(",")||"none"})`)' "$status"
            exit 1
          fi
          node -e 'const d=require("./.provision/token.json"); if(d.success!==true||d.result?.status!=="active") process.exit(1)'
      - name: Discover D1 resources in that account
        shell: bash
        run: |
          npx wrangler d1 list --json > .provision/d1-list.json
      - name: Prepare account-neutral Worker configuration
        id: d1
        shell: bash
        run: |
          state=$(node scripts/prepare-cloudflare-provision.mjs "${{ inputs.installation_slug }}" .provision/d1-list.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Check for resource collisions
        id: resources
        shell: bash
        run: |
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output .provision/pages-list.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          test "$status" = "200"
          node -e 'const d=require("./.provision/pages-list.json"); if(d.success!==true||!Array.isArray(d.result)) process.exit(1)'
          pages=$(node scripts/cloudflare-resource-state.mjs pages "${{ inputs.installation_slug }}-dashboard" .provision/pages-list.json)
          if npx wrangler deployments list --name "${{ inputs.installation_slug }}-api" --json > .provision/worker-deployments.json 2>/dev/null; then
            worker=exists
            npx wrangler secret list --json --config .provision/wrangler.json > .provision/worker-secrets.json
            worker_secrets=$(node -e 'const s=require("./.provision/worker-secrets.json"); const n=new Set(s.map(x=>x.name)); process.stdout.write(n.has("SESSION_KEY")&&n.has("INTEGRATION_KEY")?"exists":"missing")')
          else
            worker=missing
            worker_secrets=missing
          fi
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "worker_secrets=$worker_secrets" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.operation }}" = "create" ]; then
            test "${{ steps.d1.outputs.state }}" = "missing"
            test "$pages" = "missing"
            test "$worker" = "missing"
          elif [ "${{ inputs.operation }}" = "upgrade" ]; then
            test "${{ steps.d1.outputs.state }}" = "exists"
            test "$pages" = "exists"
            test "$worker" = "exists"
            test "$worker_secrets" = "exists"
          else
            test "${{ steps.d1.outputs.state }}" = "exists"
          fi
      - name: Create D1 database
        if: inputs.operation == 'create'
        shell: bash
        run: |
          npx wrangler d1 create "${{ inputs.installation_slug }}-data" --binding DB --update-config --config .provision/wrangler.json
          npx wrangler d1 list --json > .provision/d1-list.json
          test "$(node scripts/prepare-cloudflare-provision.mjs "${{ inputs.installation_slug }}" .provision/d1-list.json)" = "exists"
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "${{ inputs.installation_slug }}-data" --remote --config .provision/wrangler.json
      - name: Generate installation session key
        if: steps.resources.outputs.worker_secrets == 'missing'
        shell: bash
        run: |
          SESSION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          INTEGRATION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          echo "::add-mask::$SESSION_KEY"
          echo "::add-mask::$INTEGRATION_KEY"
          echo "SESSION_KEY=$SESSION_KEY" >> "$GITHUB_ENV"
          echo "INTEGRATION_KEY=$INTEGRATION_KEY" >> "$GITHUB_ENV"
      - name: Deploy new or incomplete Worker API with generated secrets
        if: steps.resources.outputs.worker_secrets == 'missing'
        id: deploy-api-new
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .provision
          preCommands: npx wrangler deploy
          command: deploy
          secrets: |
            SESSION_KEY
            INTEGRATION_KEY
        env:
          SESSION_KEY: ${{ env.SESSION_KEY }}
          INTEGRATION_KEY: ${{ env.INTEGRATION_KEY }}
      - name: Deploy existing Worker API without rotating secrets
        if: steps.resources.outputs.worker_secrets == 'exists'
        id: deploy-api-existing
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .provision/wrangler.json
      - name: Select Worker deployment URL
        id: deploy-api
        shell: bash
        env:
          NEW_API_URL: ${{ steps.deploy-api-new.outputs.deployment-url }}
          EXISTING_API_URL: ${{ steps.deploy-api-existing.outputs.deployment-url }}
        run: |
          api_url="${NEW_API_URL:-$EXISTING_API_URL}"
          test -n "$api_url"
          echo "deployment-url=$api_url" >> "$GITHUB_OUTPUT"
      - name: Build dashboard for the new API
        env:
          VITE_API_BASE_URL: /api
        run: npm --workspace @lancerlogin/dashboard run build
      - name: Add same-origin Pages API proxy
        run: node scripts/prepare-pages-proxy.mjs "${{ steps.deploy-api.outputs.deployment-url }}"
      - name: Create Pages project
        if: steps.resources.outputs.pages == 'missing'
        run: npx wrangler pages project create "${{ inputs.installation_slug }}-dashboard" --production-branch main
      - name: Deploy Pages dashboard
        id: deploy-dashboard
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/dashboard/dist --project-name=${{ inputs.installation_slug }}-dashboard --branch=main --commit-hash=${{ github.sha }}
      - name: Publish setup links
        shell: bash
        env:
          API_URL: ${{ steps.deploy-api.outputs.deployment-url }}
          DASHBOARD_URL: https://${{ inputs.installation_slug }}-dashboard.pages.dev
        run: |
          {
            echo "## LancerLogin installation ${{ inputs.operation }} complete"
            echo ""
            echo "- Dashboard: $DASHBOARD_URL"
            echo "- Worker API: $API_URL"
            echo ""
            echo "Open the dashboard to create the first Admin and review the privacy notice."
          } >> "$GITHUB_STEP_SUMMARY"
