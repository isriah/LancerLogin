name: Install or upgrade LancerLogin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create, resume an interrupted setup, or upgrade an existing installation
        required: true
        default: create
        type: choice
        options:
          - create
          - resume
          - upgrade
      release:
        description: Choose the release to install (latest beta is for upgrade only, on the Beta update track)
        required: true
        default: latest stable
        type: choice
        options:
          - latest stable
          - latest beta
      installation_slug:
        description: Lowercase installation slug, for example example-club
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lancerlogin-production-installation
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    # Secrets are set only on the steps that use them. npm ci (with dependency lifecycle scripts), module composition and
    # the builds run without Cloudflare, setup or update credentials in their environment.
    env:
      INPUT_OPERATION: ${{ inputs.operation }}
      RELEASE_SELECTION: ${{ inputs.release }}
      DATABASE_NAME: ${{ vars.LANCERLOGIN_DATABASE_NAME }}
      # Optional Worker placement hint such as aws:us-east-1; unset deploys with Smart Placement.
      LANCERLOGIN_WORKER_PLACEMENT_REGION: ${{ vars.LANCERLOGIN_WORKER_PLACEMENT_REGION }}
      INSTALLATION_SLUG: ${{ inputs.installation_slug }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LANCERLOGIN_UPDATE_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/provision-template.yml
      LANCERLOGIN_UPDATE_REPOSITORY: ${{ github.repository }}
      REFRESH_CREDENTIAL_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/refresh-web-update-credential.yml
      ENVIRONMENTS_URL: https://github.com/${{ github.repository }}/settings/environments
      WEB_UPDATE_CONFIG: .provision/wrangler.json
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_SANITIZE: "true"
    defaults:
      run:
        working-directory: lancerlogin-source
    steps:
      - name: Require a private deployment repository
        shell: bash
        working-directory: .
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ]; then
            echo "::error title=private_repository_required::Cloudflare deployment is allowed only from an adopter-owned private repository: make this repository private, or create a private repository from the template, then run this workflow there."
            exit 1
          fi
      - name: Validate deployment request
        shell: bash
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANCERLOGIN_SETUP_CODE: ${{ secrets.LANCERLOGIN_SETUP_CODE }}
        run: |
          if ! printf '%s' "$INPUT_OPERATION" | grep -Eq '^(create|resume|upgrade)$'; then
            echo "::error title=operation_invalid::Choose create, resume, or upgrade as the operation, then run this workflow again."
            exit 1
          fi
          if [ "$RELEASE_SELECTION" != "latest stable" ] && [ "$RELEASE_SELECTION" != "latest beta" ]; then
            echo "::error title=release_selection_invalid::Choose latest stable or latest beta as the release, then run this workflow again."
            exit 1
          fi
          # A new installation always starts on the Stable update track, so only an existing one can take a beta.
          if [ "$RELEASE_SELECTION" = "latest beta" ] && [ "$INPUT_OPERATION" != "upgrade" ]; then
            echo "::error title=beta_requires_upgrade::The release latest beta is available only with the operation upgrade, and $INPUT_OPERATION always installs the latest stable release. Run this workflow again with the release latest stable. To move an existing installation to a beta, choose the Beta track in Settings > Updates > Update track first, then run the operation upgrade with the release latest beta."
            exit 1
          fi
          if ! printf '%s' "$INSTALLATION_SLUG" | grep -Eq '^[a-z][a-z0-9-]{2,40}$'; then
            echo "::error title=installation_slug_invalid::The installation slug must start with a lowercase letter and contain 3-41 lowercase letters, digits, or hyphens, for example example-club: run this workflow again with a valid slug."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=cloudflare_token_required::CLOUDFLARE_API_TOKEN is not set: create an Account API token in the Cloudflare dashboard (Manage account > Account API tokens) and store it as a production environment secret."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" != cfat_* ]]; then
            echo "::error title=account_token_required::CLOUDFLARE_API_TOKEN is not an Account API token (those start with cfat_). A user API token from My Profile does not work: in the Cloudflare dashboard open Manage account > Account API tokens, create the token there, and replace the production environment secret."
            exit 1
          fi
          if [ "${#CLOUDFLARE_ACCOUNT_ID}" -ne 32 ]; then
            echo "::error title=cloudflare_account_id_invalid::CLOUDFLARE_ACCOUNT_ID must be the 32-character ID of the Cloudflare account (the part after dash.cloudflare.com/ in the dashboard address), not a zone ID: replace the production environment secret."
            exit 1
          fi
          # Resume and upgrade need the setup code only while it is used; a later step decides that from the installation.
          if [ "$INPUT_OPERATION" = "create" ] && [ "${#LANCERLOGIN_SETUP_CODE}" -lt 16 ]; then
            echo "::error title=setup_code_required::LANCERLOGIN_SETUP_CODE must be a production environment secret of at least 16 characters for create: add a unique password-manager-generated value, then run this workflow again."
            exit 1
          fi
          if [ -n "$LANCERLOGIN_SETUP_CODE" ] && [ "${#LANCERLOGIN_SETUP_CODE}" -lt 16 ]; then
            echo "::error title=setup_code_too_short::LANCERLOGIN_SETUP_CODE must be at least 16 characters: replace the production environment secret with a longer value, or remove it when no first Admin is still to be created."
            exit 1
          fi
      - name: Set up Node.js for release resolution, which runs before any release is checked out
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Resolve the public release
        id: release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written here, not in a script, because it runs before any release is checked out and this workflow can install
          # a release older than it. It mirrors packages/shared/src/release-policy.mjs: version order, and which releases
          # the Beta track accepts (the same rule the dashboard updater applies).
          cat > "$RUNNER_TEMP/release-policy.cjs" <<'EOF'
          "use strict";
          const fs = require("node:fs");
          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.(0|[1-9]\d*))?$/;
          // [major, minor, patch, 0 for a beta or 1 for a stable release, beta number]: a stable X.Y.Z follows every X.Y.Z-beta.N.
          function parse(value) {
            if (typeof value !== "string" || value.length > 80) return undefined;
            const match = pattern.exec(value.replace(/^v/, ""));
            if (!match || !match.slice(1).every((part) => part === undefined || Number.isSafeInteger(Number(part)))) return undefined;
            return [BigInt(match[1]), BigInt(match[2]), BigInt(match[3]), match[4] === undefined ? 1n : 0n, BigInt(match[4] ?? 0)];
          }
          function compare(left, right) {
            const a = parse(left); const b = parse(right);
            if (!a || !b) return undefined;
            for (let index = 0; index < a.length; index++) if (a[index] !== b[index]) return a[index] > b[index] ? 1 : -1;
            return 0;
          }
          // A complete official release: published, a canonical v tag whose prerelease flag matches it, every kiosk asset,
          // and for a beta an immutable release.
          function official(release) {
            if (!release || typeof release !== "object" || release.draft !== false || !Array.isArray(release.assets)) return false;
            const tag = release.tag_name;
            const version = typeof tag === "string" && tag.startsWith("v") ? parse(tag) : undefined;
            if (!version) return false;
            if (version[3] === 0n ? release.prerelease !== true || release.immutable !== true : release.prerelease !== false) return false;
            const names = new Set(release.assets.map((asset) => asset?.name));
            const archives = ["arm64", "armv7"].map((arch) => `lancerlogin-kiosk-${tag.slice(1)}-linux-${arch}.tar.gz`);
            return ["install-lancerlogin.sh", ...archives].every((name) => names.has(name) && names.has(`${name}.sha256`));
          }
          // The highest version wins, never the most recent publication. A full last page cannot prove a newest release.
          function newest(pages) {
            if (!Array.isArray(pages) || pages.length === 0 || pages.some((page) => !Array.isArray(page)) || pages[pages.length - 1].length >= 100) return undefined;
            return pages.flat().filter(official).map((release) => release.tag_name).sort((a, b) => compare(b, a))[0];
          }
          // The release a Worker reports on /health, when it is an official version.
          function installed(health) {
            const version = health && typeof health === "object" ? health.releaseVersion : undefined;
            return typeof version === "string" && !version.startsWith("v") && parse(version) ? version : undefined;
          }
          // The same release as Cloudflare's Worker settings record it: the one plain-text RELEASE_VERSION variable.
          function configured(settings) {
            const bindings = settings && settings.success === true && Array.isArray(settings.result?.bindings) ? settings.result.bindings.filter((binding) => binding?.name === "RELEASE_VERSION") : [];
            return bindings.length === 1 && bindings[0].type === "plain_text" ? installed({ releaseVersion: bindings[0].text }) : undefined;
          }
          // Not part of the product policy: what a Worker's /health says after this run deployed tag. "ready" when it
          // answers as that release in the ready mode; otherwise "release:<version>", "mode:<mode>" or "no_answer".
          // Every release since 2.0.0 reports mode ready whenever its D1 database is bound: before the first Admin exists,
          // in maintenance and during a web update alike (setup progress is on /setup/status). Only a Worker without its
          // database reports unconfigured, so ready is the one accepted mode for create, resume and upgrade.
          function deployed(health, tag) {
            if (!health || typeof health !== "object" || Array.isArray(health) || health.service !== "lancerlogin-api") return "no_answer";
            const version = health.releaseVersion;
            if (typeof version !== "string" || `v${version}` !== tag) return `release:${typeof version === "string" && /^[0-9A-Za-z.+-]{1,80}$/.test(version) ? version : "unknown"}`;
            const mode = health.ok === true ? health.mode : "not ok";
            if (mode !== "ready") return `mode:${typeof mode === "string" && /^[a-z _-]{1,40}$/.test(mode) ? mode : "unknown"}`;
            return "ready";
          }
          module.exports = { parse, compare, official, newest, installed, configured, deployed };
          if (require.main === module) {
            const [mode, first, second] = process.argv.slice(2);
            let result;
            try {
              if (mode === "newest") result = newest(fs.readdirSync(first).filter((name) => /^page-[1-5]\.json$/.test(name)).sort().map((name) => JSON.parse(fs.readFileSync(`${first}/${name}`, "utf8"))));
              else if (mode === "compare") result = compare(first, second);
              else if (mode === "installed") result = installed(JSON.parse(fs.readFileSync(first, "utf8")));
              else if (mode === "configured") result = configured(JSON.parse(fs.readFileSync(first, "utf8")));
              else if (mode === "deployed") result = deployed(JSON.parse(fs.readFileSync(first, "utf8")), second);
            } catch { result = undefined; }
            if (result === undefined) process.exit(1);
            process.stdout.write(String(result));
          }
          EOF
          if [ "$RELEASE_SELECTION" = "latest beta" ]; then
            # What the Beta track offers: the highest complete official release, beta or stable. When the newest release
            # is a stable one, that is the release installed.
            pages="$RUNNER_TEMP/release-pages"
            rm -rf "$pages"
            mkdir -p "$pages"
            for page in 1 2 3 4 5; do
              if ! gh api "repos/isriah/LancerLogin/releases?per_page=100&page=$page" > "$pages/page-$page.json"; then
                echo "::error title=release_invalid::GitHub did not list the LancerLogin releases: run this workflow again later."
                exit 1
              fi
              if [ "$(node -e 'const page = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(Array.isArray(page) && page.length >= 100 ? "full" : "last")' "$pages/page-$page.json")" = "last" ]; then break; fi
            done
            if ! tag=$(node "$RUNNER_TEMP/release-policy.cjs" newest "$pages"); then
              echo "::error title=release_invalid::A complete official LancerLogin release could not be confirmed for the Beta track: run this workflow again later."
              exit 1
            fi
          elif [ "$RELEASE_SELECTION" = "latest stable" ]; then
            tag=$(gh api repos/isriah/LancerLogin/releases/latest --jq .tag_name)
            if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error title=release_invalid::The latest stable release is not a valid LancerLogin version: run this workflow again later."
              exit 1
            fi
            gh api "repos/isriah/LancerLogin/releases/tags/$tag" --jq 'select(.draft == false and .prerelease == false) | .tag_name' | grep -Fx "$tag"
          else
            echo "::error title=release_selection_invalid::Choose latest stable or latest beta as the release, then run this workflow again."
            exit 1
          fi
          sha=$(gh api "repos/isriah/LancerLogin/commits/$tag" --jq .sha)
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          case "$tag" in *-beta.*) kind="a beta release" ;; *) kind="a stable release" ;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_KIND=$kind" >> "$GITHUB_ENV"
          echo "Using LancerLogin $tag, $kind."
      - name: Check out the selected public release
        uses: actions/checkout@v7
        with:
          repository: isriah/LancerLogin
          ref: ${{ steps.release.outputs.sha }}
          path: lancerlogin-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: lancerlogin-source/package-lock.json
      - name: Verify the checked-out release identity
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "::error title=release_identity_mismatch::Selected tag $RELEASE_TAG does not match package version v$package_version: run this workflow again later."
            exit 1
          fi
      - run: npm ci
      - name: Check the optional dashboard update credential before any cloud mutation
        id: update-credential
        shell: bash
        env:
          LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
          # Optional: separate Contents-write token for dashboard plugin management. See docs/MODULE-PLUGINS.md for its scope.
          LANCERLOGIN_MODULE_SELECTION_TOKEN: ${{ secrets.LANCERLOGIN_MODULE_SELECTION_TOKEN }}
        run: |
          # Dashboard updates are optional, and so are both tokens. A token GitHub rejects, or one this release does not
          # accept, never stops resume or upgrade: the run warns and continues as if the token were not set, and nothing
          # is uploaded, so the Worker keeps the credential it already has and Settings > Updates > Setup status reports
          # that one as expired or rejected. Only create stops, before anything exists, so a mistyped token is noticed
          # at once. Written here, not in a script, because this workflow can install a release older than this rule.
          if [ -z "$LANCERLOGIN_WEB_UPDATE_TOKEN" ]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            if [ -n "$LANCERLOGIN_MODULE_SELECTION_TOKEN" ]; then
              echo "::warning title=selection_credential_skipped::LANCERLOGIN_MODULE_SELECTION_TOKEN is not installed until LANCERLOGIN_WEB_UPDATE_TOKEN is also set."
            fi
            echo "::warning title=dispatch_credential_not_configured::LANCERLOGIN_WEB_UPDATE_TOKEN is not set, so dashboard updates are not set up yet. The installation continues without them; the run summary lists the steps to set them up."
            exit 0
          fi
          selection_token=$LANCERLOGIN_MODULE_SELECTION_TOKEN
          selection_state=missing
          if [ -n "$selection_token" ]; then selection_state=configured; fi
          delete_instead="To keep updating with this workflow instead, delete the secret LANCERLOGIN_WEB_UPDATE_TOKEN, which also stops this warning."
          off_until_fixed="One-click updates from the dashboard are off until that is fixed and Refresh web update credential has run. $delete_instead"
          kept="It was not installed, and the dashboard keeps the token it already has. Run Refresh web update credential later to install it."
          create_fix="fix it, or delete the secret LANCERLOGIN_WEB_UPDATE_TOKEN to install without one-click updates, then run create again."
          create_later="run create again later, or delete the secret LANCERLOGIN_WEB_UPDATE_TOKEN first to install without one-click updates."
          # skip_token <code> <what is wrong> <what that means and the fix, for resume and upgrade> <the fix, for create>
          skip_token() {
            if [ "$INPUT_OPERATION" = "create" ]; then
              echo "::error title=$1::$2 Create stopped before any change. The token is optional: $4"
              exit 1
            fi
            echo "::warning title=$1::$2 The token is optional, so this $INPUT_OPERATION continues as if it were not set. $3"
            {
              echo "state=skipped"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # skip_selection <code> <what is wrong>: the dashboard update token is still checked and installed.
          skip_selection() {
            if [ "$INPUT_OPERATION" = "create" ]; then
              echo "::error title=$1::$2 Create stopped before any change. The token is optional: fix it, or delete the secret LANCERLOGIN_MODULE_SELECTION_TOKEN to install without dashboard plugin management, then run create again."
              exit 1
            fi
            echo "::warning title=$1::$2 The token is optional, so this $INPUT_OPERATION continues as if it were not set, and the dashboard keeps the plugin management token it already has. To fix it, replace the secret LANCERLOGIN_MODULE_SELECTION_TOKEN with a token that has Contents: Read and write on only this repository, then run Refresh web update credential. To stop this warning instead, delete the secret."
            selection_token=""
            selection_state=skipped
            module_selection_expires_at=""
          }
          # GitHub reports an expiring token's expiry in a response header, so no expiry is entered by hand. Releases before
          # v2.0.0-beta.17 read it from WEB_UPDATE_TOKEN_EXPIRES_AT and MODULE_SELECTION_TOKEN_EXPIRES_AT, so it is passed on.
          # Sets expiry, and problem to rejected, unavailable or unreadable when the token cannot be used as it is.
          read_expiry() {
            local headers="$RUNNER_TEMP/github-token-headers.txt" value
            expiry=""
            problem=""
            http_status=$(curl --silent --show-error --proto '=https' --tlsv1.2 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              --header "Authorization: Bearer $1" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$LANCERLOGIN_UPDATE_REPOSITORY") || http_status=000
            value=$(grep -i '^github-authentication-token-expiration:' "$headers" 2>/dev/null | tail -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true)
            rm -f "$headers"
            case "$http_status" in
              401) problem=rejected ;;
              000|5??) problem=unavailable ;;
              *)
                if [ -n "$value" ] && ! expiry=$(date -u -d "$value" +%Y-%m-%dT%H:%M:%S.000Z); then
                  expiry=""
                  problem=unreadable
                fi ;;
            esac
          }
          read_expiry "$LANCERLOGIN_WEB_UPDATE_TOKEN"
          case "$problem" in
            rejected) skip_token dispatch_credential_rejected "GitHub rejected LANCERLOGIN_WEB_UPDATE_TOKEN, the token for one-click dashboard updates: it has expired or been revoked." "One-click updates from the dashboard are off until you replace it: create a new fine-grained token, store it as LANCERLOGIN_WEB_UPDATE_TOKEN, then run Refresh web update credential. $delete_instead" "replace the secret LANCERLOGIN_WEB_UPDATE_TOKEN with a new fine-grained token, or delete the secret to install without one-click updates, then run create again." ;;
            unavailable) skip_token dispatch_credential_check_unavailable "GitHub did not answer the check of LANCERLOGIN_WEB_UPDATE_TOKEN (HTTP $http_status), so the token could not be verified." "$kept" "$create_later" ;;
            unreadable) skip_token token_expiration_unreadable "GitHub reported the expiry of LANCERLOGIN_WEB_UPDATE_TOKEN in an unexpected format." "$kept" "$create_later" ;;
          esac
          web_update_expires_at=$expiry
          module_selection_expires_at=""
          if [ -n "$selection_token" ]; then
            read_expiry "$selection_token"
            module_selection_expires_at=$expiry
            case "$problem" in
              rejected) skip_selection selection_credential_rejected "GitHub rejected LANCERLOGIN_MODULE_SELECTION_TOKEN, the token for dashboard plugin management: it has expired or been revoked." ;;
              unavailable) skip_selection selection_credential_check_unavailable "GitHub did not answer the check of LANCERLOGIN_MODULE_SELECTION_TOKEN (HTTP $http_status), so the token could not be verified." ;;
              unreadable) skip_selection token_expiration_unreadable "GitHub reported the expiry of LANCERLOGIN_MODULE_SELECTION_TOKEN in an unexpected format." ;;
            esac
          fi
          # Those earlier releases also refuse a token without an expiry.
          if ! grep -qi 'github-authentication-token-expiration' scripts/refresh-web-update-credential.mjs; then
            if [ -z "$web_update_expires_at" ]; then
              skip_token dispatch_credential_expiry_required "LancerLogin $RELEASE_TAG accepts only GitHub tokens that have an expiration date, and LANCERLOGIN_WEB_UPDATE_TOKEN has none." "One-click updates from the dashboard are off until you replace it with a fine-grained token that has an expiration and run Refresh web update credential. $delete_instead" "replace the secret LANCERLOGIN_WEB_UPDATE_TOKEN with a fine-grained token that has an expiration, or delete the secret to install without one-click updates, then run create again."
            fi
            if [ -n "$selection_token" ] && [ -z "$module_selection_expires_at" ]; then
              skip_selection selection_credential_expiry_required "LancerLogin $RELEASE_TAG accepts only GitHub tokens that have an expiration date, and LANCERLOGIN_MODULE_SELECTION_TOKEN has none."
            fi
          fi
          # The selected release's own check: repository access, the update workflow and, when set, the plugin token.
          # Sets code and detail from its error annotation, which this step replaces with one that says whether the run continues.
          verify_release() {
            local log="$RUNNER_TEMP/update-credential-check.txt" result=0
            WEB_UPDATE_TOKEN_EXPIRES_AT=$web_update_expires_at MODULE_SELECTION_TOKEN_EXPIRES_AT=$module_selection_expires_at LANCERLOGIN_MODULE_SELECTION_TOKEN=$selection_token \
              node scripts/refresh-web-update-credential.mjs --verify-only > "$log" 2>&1 || result=$?
            code=$(sed -n 's/^::error title=\([a-z_]*\)::.*/\1/p' "$log" | head -n 1)
            detail=$(sed -n 's/^::error title=[a-z_]*:://p' "$log" | head -n 1)
            grep -v '^::error ' "$log" || true
            rm -f "$log"
            return "$result"
          }
          verified=true
          verify_release || verified=false
          if [ "$verified" = "false" ] && [ "${code#selection_credential_}" != "$code" ]; then
            skip_selection "$code" "${detail:-LancerLogin $RELEASE_TAG did not accept LANCERLOGIN_MODULE_SELECTION_TOKEN.}"
            verified=true
            verify_release || verified=false
          fi
          if [ "$verified" = "false" ]; then
            # Not about the optional tokens: these stop every operation.
            case "$code" in
              private_installation_required|installation_slug_required|private_repository_required)
                echo "::error title=$code::$detail"
                exit 1 ;;
            esac
            skip_token "${code:-dispatch_credential_check_failed}" "${detail:-LancerLogin $RELEASE_TAG did not accept LANCERLOGIN_WEB_UPDATE_TOKEN.}" "$off_until_fixed" "$create_fix"
          fi
          {
            echo "state=configured"
            echo "selection=$selection_state"
            echo "web_update_expires_at=$web_update_expires_at"
            echo "module_selection_expires_at=$module_selection_expires_at"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the scoped token and selected Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .provision
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          rm -f .provision/token.json
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            --output .provision/token.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify") || status="${status:-000}"
          # The token is required, so every failure here stops the run. Cloudflare's error codes are listed, not interpreted:
          # its API documentation does not define them for this request, so the advice follows the HTTP status.
          codes=$(node -e 'try { const d=require("./.provision/token.json"); process.stdout.write((d.errors||[]).map((e)=>e.code).join(" ")); } catch {}' 2>/dev/null || true)
          seen="HTTP $status; codes: ${codes:-none}"
          new_token="create a new Account API token in the Cloudflare dashboard (Manage account > Account API tokens) with the four permissions listed at https://isriah.github.io/LancerLogin/setup.html#cloudflare-token, replace the production environment secret CLOUDFLARE_API_TOKEN with it, then run this workflow again."
          case "$status" in
            200) ;;
            401)
              # Authentication failed: the usual cause for an installation updated months after setup is a token that
              # expired or was deleted. A token used with another account's ID fails the same way.
              echo "::error title=cloudflare_token_rejected::Cloudflare did not accept CLOUDFLARE_API_TOKEN ($seen). The token has probably expired or been deleted, which is the usual cause when this installation was set up or last updated a while ago: $new_token If the token is new, check instead that CLOUDFLARE_ACCOUNT_ID names the account that owns it."
              exit 1 ;;
            000|429|5??)
              echo "::error title=cloudflare_token_check_unavailable::Cloudflare did not answer the check of CLOUDFLARE_API_TOKEN ($seen), so the token could not be verified and nothing was changed: run this workflow again in a few minutes."
              exit 1 ;;
            *)
              echo "::error title=cloudflare_token_rejected::Cloudflare refused CLOUDFLARE_API_TOKEN for CLOUDFLARE_ACCOUNT_ID ($seen): check that CLOUDFLARE_ACCOUNT_ID names the account that owns the Account API token (Manage account > Account API tokens in that account) and that the token is active. If the token has expired or been deleted, $new_token"
              exit 1 ;;
          esac
          token_status=$(node -e 'try { const d=require("./.provision/token.json"); process.stdout.write(d.success === true && typeof d.result?.status === "string" ? d.result.status : ""); } catch {}' 2>/dev/null || true)
          if [ "$token_status" != "active" ]; then
            if [ -n "$token_status" ] && printf '%s' "$token_status" | grep -Eq '^[a-z_]{1,20}$'; then reported="Cloudflare reports CLOUDFLARE_API_TOKEN as $token_status, not active"; else reported="Cloudflare did not report CLOUDFLARE_API_TOKEN as active"; fi
            echo "::error title=account_token_invalid::$reported. An expired or disabled token cannot deploy: $new_token"
            exit 1
          fi
      - name: Check the Cloudflare account and token permissions before any cloud mutation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Read-only list requests, so a missing permission or account setting stops the run before anything is created.
          cf_get() {
            curl --silent --show-error --proto '=https' --tlsv1.2 --output "$2" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID$1"
          }
          missing_permission() {
            echo "::error title=cloudflare_permission_missing::CLOUDFLARE_API_TOKEN cannot read $1 in this account: in the Cloudflare dashboard open Manage account > Account API tokens, edit the token to add $2, then run this workflow again."
            exit 1
          }
          require_read() {
            local status
            status=$(cf_get "$1" .provision/preflight.json)
            if [ "$status" = "401" ] || [ "$status" = "403" ]; then missing_permission "$2" "$3"; fi
            if [ "$status" != "200" ] || ! node -e 'process.exit(require("./.provision/preflight.json").success === true ? 0 : 1)'; then
              echo "::error title=cloudflare_request_failed::Cloudflare did not list $2 (HTTP $status): check CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN, then run this workflow again."
              exit 1
            fi
          }
          require_read "/workers/scripts" "Workers scripts" "Workers Scripts: Edit"
          require_read "/d1/database?per_page=1" "D1 databases" "D1: Edit"
          require_read "/pages/projects" "Pages projects" "Cloudflare Pages: Edit"
          # The Worker API is served at <slug>-api.<subdomain>.workers.dev, which needs the account's workers.dev subdomain.
          status=$(cf_get /workers/subdomain .provision/workers-subdomain.json)
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then missing_permission "the workers.dev subdomain" "Workers Scripts: Edit"; fi
          if [ "$status" != "200" ] || ! node -e 'const d=require("./.provision/workers-subdomain.json"); process.exit(d.success === true && d.result?.subdomain ? 0 : 1)'; then
            echo "::error title=workers_subdomain_required::This Cloudflare account has no workers.dev subdomain yet, so the Worker API would have no address: in the Cloudflare dashboard open Workers & Pages, set the account's workers.dev subdomain, then run this workflow again."
            exit 1
          fi
          # Kept for the installed-release check, which reads the Worker's /health at its workers.dev address.
          node -e 'process.stdout.write(String(require("./.provision/workers-subdomain.json").result.subdomain))' > .provision/workers-subdomain.txt
          rm -f .provision/preflight.json .provision/workers-subdomain.json
          echo "The token can read Workers, D1 and Pages, and the account has a workers.dev subdomain."
      - name: Discover D1 resources in that account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 list --json > .provision/d1-list.json
      - name: Prepare account-neutral Worker configuration
        id: d1
        shell: bash
        run: |
          state=$(node scripts/prepare-cloudflare-provision.mjs "$INSTALLATION_SLUG" .provision/d1-list.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Check for resource collisions
        id: resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_STATE: ${{ steps.d1.outputs.state }}
        run: |
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output .provision/pages-list.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          test "$status" = "200"
          node -e 'const d=require("./.provision/pages-list.json"); if(d.success!==true||!Array.isArray(d.result)) process.exit(1)'
          pages=$(node scripts/cloudflare-resource-state.mjs pages "$INSTALLATION_SLUG-dashboard" .provision/pages-list.json)
          if npx wrangler deployments list --name "$INSTALLATION_SLUG-api" --json > .provision/worker-deployments.json 2>/dev/null; then
            worker=exists
            npx wrangler secret list --format json --config .provision/wrangler.json > .provision/worker-secrets.json
            worker_secrets=$(node -e 'const s=require("./.provision/worker-secrets.json"); const n=new Set(s.map(x=>x.name)); process.stdout.write(n.has("SESSION_KEY")&&n.has("INTEGRATION_KEY")&&n.has("BOOTSTRAP_CODE_HASH")?"exists":"missing")')
          else
            worker=missing
            worker_secrets=missing
          fi
          {
            echo "pages=$pages"
            echo "worker=$worker"
            echo "worker_secrets=$worker_secrets"
          } >> "$GITHUB_OUTPUT"
          database="${DATABASE_NAME:-$INSTALLATION_SLUG-data}"
          existing=()
          missing=()
          if [ "$D1_STATE" = "exists" ]; then existing+=("the D1 database $database"); else missing+=("the D1 database $database"); fi
          if [ "$pages" = "exists" ]; then existing+=("the Pages project $INSTALLATION_SLUG-dashboard"); else missing+=("the Pages project $INSTALLATION_SLUG-dashboard"); fi
          if [ "$worker" = "exists" ]; then existing+=("the Worker $INSTALLATION_SLUG-api"); else missing+=("the Worker $INSTALLATION_SLUG-api"); fi
          join() { local list; printf -v list '%s, ' "$@"; printf '%s' "${list%, }"; }
          if [ "$INPUT_OPERATION" = "create" ]; then
            if [ "${#existing[@]}" -gt 0 ]; then
              echo "::error title=installation_resources_exist::Create stopped before any change because this Cloudflare account already has $(join "${existing[@]}"). If an earlier create with the slug $INSTALLATION_SLUG stopped partway, run this workflow again with the operation resume and the same slug. To make a separate installation, choose a different slug."
              exit 1
            fi
          elif [ "$INPUT_OPERATION" = "upgrade" ]; then
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error title=installation_incomplete::Upgrade stopped before any change because these were not found in this Cloudflare account: $(join "${missing[@]}"). Check the slug and LANCERLOGIN_DATABASE_NAME, or run this workflow with the operation resume and the same slug to finish an interrupted setup."
              exit 1
            fi
            if [ "$worker_secrets" != "exists" ]; then
              echo "::error title=installation_incomplete::Upgrade stopped before any change because the Worker $INSTALLATION_SLUG-api lacks its installation secrets. Run this workflow with the operation resume and the same slug to finish the setup."
              exit 1
            fi
          else
            # An interrupted create can stop after the Pages project and before the D1 database exists. A Worker without
            # its database is never given a new, empty one.
            if [ "$D1_STATE" != "exists" ] && [ "$worker" = "exists" ]; then
              echo "::error title=installation_database_missing::Resume stopped before any change because the Worker $INSTALLATION_SLUG-api exists but the D1 database $database was not found. Check LANCERLOGIN_DATABASE_NAME; a new, empty database is never created for an existing Worker."
              exit 1
            fi
            if [ "${#existing[@]}" -eq 0 ]; then
              echo "::error title=installation_not_found::Resume stopped because nothing exists in this Cloudflare account for the slug $INSTALLATION_SLUG. Check the slug, or run this workflow with the operation create."
              exit 1
            fi
          fi
      - name: Check the update track and refuse a downgrade before any cloud mutation
        if: steps.resources.outputs.worker == 'exists'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Read-only. The Admin's update track is stored in D1 by Settings > Updates. An installation whose release
          # predates update tracks has no such table and is on Stable.
          if [ "$RELEASE_SELECTION" = "latest beta" ]; then
            database="${DATABASE_NAME:-$INSTALLATION_SLUG-data}"
            track=stable
            npx wrangler d1 execute "$database" --remote --json --config .provision/wrangler.json \
              --command "SELECT COUNT(*) AS tables FROM sqlite_master WHERE type = 'table' AND name = 'installation_update_settings'" > .provision/track-table.json
            if node -e 'process.exit(require("./.provision/track-table.json")[0]?.results?.[0]?.tables === 1 ? 0 : 1)'; then
              npx wrangler d1 execute "$database" --remote --json --config .provision/wrangler.json \
                --command "SELECT update_channel FROM installation_update_settings WHERE installation_id = 'primary'" > .provision/track.json
              track=$(node -e 'process.stdout.write(require("./.provision/track.json")[0]?.results?.[0]?.update_channel === "beta" ? "beta" : "stable")')
            fi
            if [ "$track" != "beta" ]; then
              echo "::error title=beta_track_required::This installation is on the Stable update track, so the release latest beta is refused and nothing was changed. In the dashboard, open Settings > Updates > Update track, choose Beta and save it, then run this workflow again. To stay on Stable, run it with the release latest stable."
              exit 1
            fi
            echo "Update track: Beta."
          fi
          # The Worker reports the release it runs on its public /health. An older release is never deployed over a newer
          # one: database migrations are forward-only, and Cloudflare blocks some Worker rollbacks.
          subdomain=$(cat .provision/workers-subdomain.txt)
          if ! printf '%s' "$subdomain" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then subdomain=""; fi
          api_origin="https://$INSTALLATION_SLUG-api.$subdomain.workers.dev"
          installed=""
          if [ -n "$subdomain" ] && curl --silent --show-error --fail --proto '=https' --tlsv1.2 --max-time 20 --retry 2 --output .provision/installed-health.json "$api_origin/health"; then
            installed=$(node "$RUNNER_TEMP/release-policy.cjs" installed .provision/installed-health.json || true)
          fi
          source="$api_origin/health"
          if [ -z "$installed" ]; then
            # A Worker that cannot answer still has its configuration: every deployment sets the release as the plain-text
            # variable RELEASE_VERSION, which Cloudflare returns with the Worker's settings.
            status=$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 --output .provision/worker-settings.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$INSTALLATION_SLUG-api/settings") || status="${status:-000}"
            if [ "$status" = "200" ]; then
              installed=$(node "$RUNNER_TEMP/release-policy.cjs" configured .provision/worker-settings.json || true)
              source="the Worker's RELEASE_VERSION setting, because $api_origin/health did not answer with a release"
            fi
          fi
          if [ -z "$installed" ]; then
            if [ "$RELEASE_SELECTION" = "latest beta" ]; then
              echo "::error title=installed_release_unreadable::Upgrade stopped before any change because the release this installation runs could not be read from $api_origin/health or from the Worker's settings, so the run cannot tell whether $RELEASE_TAG would be a downgrade. Check that the Worker $INSTALLATION_SLUG-api answers at that address, then run this workflow again. To repair an installation whose Worker does not answer, run it with the release latest stable."
              exit 1
            fi
            echo "::warning title=installed_release_unreadable::The release the Worker $INSTALLATION_SLUG-api runs could not be read from $api_origin/health or from the Worker's settings, so this run could not confirm that $RELEASE_TAG is not a downgrade. It continues, because $INPUT_OPERATION with the release latest stable is also how an installation whose Worker does not answer is repaired. If this installation runs a beta newer than $RELEASE_TAG, cancel this run now."
            exit 0
          fi
          echo "Installed release v$installed, read from $source."
          order=$(node "$RUNNER_TEMP/release-policy.cjs" compare "$RELEASE_TAG" "v$installed")
          if [ "$order" = "-1" ]; then
            case "$installed" in
              *-beta.*) advice="Wait for a stable release newer than v$installed, or to install a newer beta choose the release latest beta with the operation upgrade." ;;
              *) advice="Wait for a newer release." ;;
            esac
            echo "::error title=release_downgrade_refused::This installation already runs LancerLogin v$installed, which is newer than $RELEASE_TAG, the release that $RELEASE_SELECTION selects. Nothing was changed, because LancerLogin is never downgraded. $advice"
            exit 1
          fi
          if [ "$order" = "0" ]; then
            echo "::notice title=release_already_installed::This installation already runs LancerLogin $RELEASE_TAG, the release that $RELEASE_SELECTION selects. No newer release is available, so this run redeploys the same release."
          else
            echo "This run installs $RELEASE_TAG."
          fi
      - name: Check whether the first Admin exists and the setup code is needed
        id: admin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANCERLOGIN_SETUP_CODE: ${{ secrets.LANCERLOGIN_SETUP_CODE }}
          D1_STATE: ${{ steps.d1.outputs.state }}
          WORKER_SECRETS: ${{ steps.resources.outputs.worker_secrets }}
        run: |
          # Read-only queries: whether the installations table exists yet, then whether it holds the installation, which
          # setup creates together with the first Admin.
          admin=missing
          database="${DATABASE_NAME:-$INSTALLATION_SLUG-data}"
          if [ "$D1_STATE" = "exists" ]; then
            npx wrangler d1 execute "$database" --remote --json --config .provision/wrangler.json \
              --command "SELECT COUNT(*) AS tables FROM sqlite_master WHERE type = 'table' AND name = 'installations'" > .provision/admin-table.json
            if node -e 'process.exit(require("./.provision/admin-table.json")[0]?.results?.[0]?.tables === 1 ? 0 : 1)'; then
              npx wrangler d1 execute "$database" --remote --json --config .provision/wrangler.json \
                --command "SELECT COUNT(*) AS installations FROM installations" > .provision/admin.json
              admin=$(node -e 'process.stdout.write(require("./.provision/admin.json")[0]?.results?.[0]?.installations > 0 ? "exists" : "missing")')
            fi
          fi
          # The setup code is hashed into BOOTSTRAP_CODE_HASH when the Worker secrets are generated, and again on create or
          # resume while no first Admin exists, so a changed LANCERLOGIN_SETUP_CODE takes effect.
          rotate=false
          reason=""
          if [ "$WORKER_SECRETS" != "exists" ]; then
            reason="this run generates the Worker secrets"
          elif [ "$INPUT_OPERATION" != "upgrade" ] && [ "$admin" = "missing" ]; then
            reason="no first Admin exists yet, so this run sets the setup code"
            rotate=true
          fi
          if [ -n "$reason" ] && [ "${#LANCERLOGIN_SETUP_CODE}" -lt 16 ]; then
            echo "::error title=setup_code_required::LANCERLOGIN_SETUP_CODE must be a production environment secret of at least 16 characters because $reason: add a unique password-manager-generated value, then run this workflow again."
            exit 1
          fi
          {
            echo "admin=$admin"
            echo "rotate_setup_code=$rotate"
          } >> "$GITHUB_OUTPUT"
          echo "First Admin: $admin."
      - name: Check out the plugin selection from this private repository
        uses: actions/checkout@v7
        with:
          path: deployment-control
          persist-credentials: false
          sparse-checkout: |
            lancerlogin.modules.json
            lancerlogin.plugin-sources.json
          sparse-checkout-cone-mode: false
      - name: Compose official modules and selected plugins before building
        shell: bash
        env:
          # Optional read-only token for private plugin repositories in lancerlogin.modules.json.
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
        run: |
          # Official modules (scripts/official-modules.json) are always composed unless the selection sets "officialModules": false.
          # Composition enforces lancerlogin.plugin-sources.json beside the selection, when present.
          # Releases before plugin support have no composer and build their built-in modules unchanged.
          if [ -f scripts/compose-modules.mjs ]; then
            if [ -f ../deployment-control/lancerlogin.modules.json ]; then
              node scripts/compose-modules.mjs --selection ../deployment-control/lancerlogin.modules.json
            else
              node scripts/compose-modules.mjs
            fi
          else
            echo "This release predates module plugins; building its built-in modules without composition."
            if [ -f ../deployment-control/lancerlogin.modules.json ]; then echo "::warning::lancerlogin.modules.json is ignored by this release, which predates module plugins."; fi
          fi
      - name: Refuse an upgrade that would drop a module that moved into a plugin
        if: inputs.operation != 'create' && steps.d1.outputs.state == 'exists'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Reads D1 only. The same check the web update controller runs before it claims an update.
          # Releases before plugin support have no extracted modules and no check.
          if [ -f scripts/check-provision-modules.mjs ]; then
            node scripts/check-provision-modules.mjs
          else
            echo "LancerLogin $RELEASE_TAG has no modules that moved into plugins."
          fi
      - name: Build dashboard before migration or deployment
        env:
          VITE_API_BASE_URL: /api
        run: npm --workspace @lancerlogin/dashboard run build
      - name: Build API before migration or deployment
        run: npx wrangler deploy --dry-run --outdir .provision/api-build --config .provision/wrangler.json
      # Cloud resources are created only after every build passed, so a failed build leaves nothing behind.
      - name: Create Pages project
        if: steps.resources.outputs.pages == 'missing'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create "$INSTALLATION_SLUG-dashboard" --production-branch main
      - name: Require the exact Pages address the installation is configured for
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pages.dev addresses are global. When another account owns <slug>-dashboard.pages.dev, Cloudflare gives a new
          # project a different address, while the Worker's allowed origin and the Google redirect use that exact one.
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output .provision/pages-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$INSTALLATION_SLUG-dashboard")
          if [ "$status" != "200" ]; then
            echo "::error title=pages_project_unavailable::Cloudflare did not return the Pages project $INSTALLATION_SLUG-dashboard (HTTP $status): run this workflow again with the operation resume and the same slug."
            exit 1
          fi
          subdomain=$(node -e 'const d=require("./.provision/pages-project.json"); process.stdout.write(d.success === true ? String(d.result?.subdomain ?? "") : "")')
          if [ "$subdomain" != "$INSTALLATION_SLUG-dashboard.pages.dev" ]; then
            if [ "$INPUT_OPERATION" = "create" ]; then created=" No D1 database or Worker was created."; else created=""; fi
            echo "::error title=pages_address_taken::The Pages project $INSTALLATION_SLUG-dashboard has the address ${subdomain:-unknown} instead of $INSTALLATION_SLUG-dashboard.pages.dev, which another Cloudflare account already uses. LancerLogin needs that exact address for the dashboard origin and Google sign-in.$created Delete the Pages project $INSTALLATION_SLUG-dashboard in the Cloudflare dashboard, then run create again with a different slug."
            exit 1
          fi
      - name: Create D1 database
        if: steps.d1.outputs.state == 'missing'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 create "${DATABASE_NAME:-$INSTALLATION_SLUG-data}" --binding DB --update-config --config .provision/wrangler.json
          npx wrangler d1 list --json > .provision/d1-list.json
          test "$(node scripts/prepare-cloudflare-provision.mjs "$INSTALLATION_SLUG" .provision/d1-list.json)" = "exists"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "${DATABASE_NAME:-$INSTALLATION_SLUG-data}" --remote --config .provision/wrangler.json
      - name: Generate installation secrets
        if: steps.resources.outputs.worker_secrets == 'missing'
        shell: bash
        env:
          LANCERLOGIN_SETUP_CODE: ${{ secrets.LANCERLOGIN_SETUP_CODE }}
        run: |
          SESSION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          INTEGRATION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          BOOTSTRAP_CODE_HASH=$(printf '%s' "$LANCERLOGIN_SETUP_CODE" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$SESSION_KEY"
          echo "::add-mask::$INTEGRATION_KEY"
          echo "::add-mask::$BOOTSTRAP_CODE_HASH"
          {
            echo "SESSION_KEY=$SESSION_KEY"
            echo "INTEGRATION_KEY=$INTEGRATION_KEY"
            echo "BOOTSTRAP_CODE_HASH=$BOOTSTRAP_CODE_HASH"
          } >> "$GITHUB_ENV"
      - name: Deploy new or incomplete Worker API
        if: steps.resources.outputs.worker_secrets == 'missing'
        id: deploy-api-new
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lancerlogin-source
          command: deploy --config .provision/wrangler.json
      - name: Upload generated Worker secrets
        if: steps.resources.outputs.worker_secrets == 'missing'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_KEY: ${{ env.SESSION_KEY }}
          INTEGRATION_KEY: ${{ env.INTEGRATION_KEY }}
          BOOTSTRAP_CODE_HASH: ${{ env.BOOTSTRAP_CODE_HASH }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({SESSION_KEY:process.env.SESSION_KEY,INTEGRATION_KEY:process.env.INTEGRATION_KEY,BOOTSTRAP_CODE_HASH:process.env.BOOTSTRAP_CODE_HASH}))' \
            | npx wrangler secret bulk --config .provision/wrangler.json
      - name: Deploy existing Worker API without rotating secrets
        if: steps.resources.outputs.worker_secrets == 'exists'
        id: deploy-api-existing
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lancerlogin-source
          command: deploy --config .provision/wrangler.json
      - name: Apply the current setup code while no first Admin exists
        if: steps.admin.outputs.rotate_setup_code == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANCERLOGIN_SETUP_CODE: ${{ secrets.LANCERLOGIN_SETUP_CODE }}
        run: |
          # Only BOOTSTRAP_CODE_HASH changes; the session and integration keys are retained.
          BOOTSTRAP_CODE_HASH=$(printf '%s' "$LANCERLOGIN_SETUP_CODE" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$BOOTSTRAP_CODE_HASH"
          BOOTSTRAP_CODE_HASH=$BOOTSTRAP_CODE_HASH node -e 'process.stdout.write(JSON.stringify({BOOTSTRAP_CODE_HASH:process.env.BOOTSTRAP_CODE_HASH}))' \
            | npx wrangler secret bulk --config .provision/wrangler.json
          echo "The first-Admin setup code now matches LANCERLOGIN_SETUP_CODE."
      - name: Prepare or retain the separate fingerprint storage key
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Stable releases before the separate fingerprint storage key do not include this script or use the key.
          if [ -f scripts/ensure-fingerprint-vault-key.mjs ]; then
            node scripts/ensure-fingerprint-vault-key.mjs
          else
            echo "LancerLogin $RELEASE_TAG does not use a separate fingerprint storage key."
          fi
      - name: Install or refresh the private dispatch credential without rotating installation secrets
        if: steps.update-credential.outputs.state == 'configured'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
          # Empty when the check above skipped the optional plugin token, so only the dashboard update token is installed.
          LANCERLOGIN_MODULE_SELECTION_TOKEN: ${{ steps.update-credential.outputs.selection != 'skipped' && secrets.LANCERLOGIN_MODULE_SELECTION_TOKEN || '' }}
          # Read from GitHub's response headers above, for releases before v2.0.0-beta.17. Later releases read them again.
          WEB_UPDATE_TOKEN_EXPIRES_AT: ${{ steps.update-credential.outputs.web_update_expires_at }}
          MODULE_SELECTION_TOKEN_EXPIRES_AT: ${{ steps.update-credential.outputs.module_selection_expires_at }}
        run: node scripts/refresh-web-update-credential.mjs
      - name: Select Worker deployment URL
        id: deploy-api
        shell: bash
        env:
          NEW_API_URL: ${{ steps.deploy-api-new.outputs.deployment-url }}
          EXISTING_API_URL: ${{ steps.deploy-api-existing.outputs.deployment-url }}
        run: |
          api_url="${NEW_API_URL:-$EXISTING_API_URL}"
          test -n "$api_url"
          echo "deployment-url=$api_url" >> "$GITHUB_OUTPUT"
      - name: Add same-origin Pages API proxy
        run: node scripts/prepare-pages-proxy.mjs "${{ steps.deploy-api.outputs.deployment-url }}"
      # Written here, not in a script, because this workflow can install a release older than the binding. That release's proxy ignores it.
      - name: Bind the Pages API proxy to the Worker
        id: pages-binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Through the binding the Worker sees each visitor's address. A fetch to workers.dev replaces it with one shared address.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data "{\"deployment_configs\":{\"production\":{\"services\":{\"API\":{\"service\":\"$INSTALLATION_SLUG-api\",\"environment\":\"production\"}}}}}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$INSTALLATION_SLUG-dashboard") || status="${status:-000}"
          # Migrations and the Worker are already live, so a refused binding must not stop before the dashboard is deployed:
          # the proxy falls back to a fetch. The web update controller treats the same refusal as a warning.
          if [ "$status" != "200" ]; then
            echo "::warning title=Pages API binding not added::pages_api_binding_failed_$status: Cloudflare did not add the Pages API binding to $INSTALLATION_SLUG-dashboard (HTTP $status), so all dashboard visitors share one sign-in limit. The run continues and still deploys the dashboard. Check that the Cloudflare token has Cloudflare Pages: Edit, then run this workflow again with the operation resume and the same slug. The next release update also adds the binding."
            echo "state=refused" >> "$GITHUB_OUTPUT"
            echo "status=$status" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Pages dashboard
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lancerlogin-source
          command: pages deploy apps/dashboard/dist --project-name=${{ inputs.installation_slug }}-dashboard --branch=main
      - name: Publish setup links
        shell: bash
        env:
          API_URL: ${{ steps.deploy-api.outputs.deployment-url }}
          DASHBOARD_URL: https://${{ inputs.installation_slug }}-dashboard.pages.dev
          ADMIN_STATE: ${{ steps.admin.outputs.admin }}
          UPDATE_CREDENTIAL_STATE: ${{ steps.update-credential.outputs.state }}
          UPDATE_CREDENTIAL_REASON: ${{ steps.update-credential.outputs.reason }}
          PAGES_BINDING_STATE: ${{ steps.pages-binding.outputs.state }}
          PAGES_BINDING_STATUS: ${{ steps.pages-binding.outputs.status }}
        run: |
          database_id=$(node -e 'const c=require("./.provision/wrangler.json"); process.stdout.write(c.d1_databases?.find((b) => b.binding === "DB")?.database_id ?? "")')
          test -n "$database_id"
          {
            echo "## LancerLogin $INPUT_OPERATION complete"
            echo ""
            echo "- Release: $RELEASE_TAG ($RELEASE_KIND)"
            echo "- Dashboard: $DASHBOARD_URL"
            echo "- Worker API: $API_URL"
            echo ""
            if [ "$INPUT_OPERATION" = "upgrade" ]; then
              echo "The existing installation data and secrets were retained."
            elif [ "$ADMIN_STATE" = "exists" ]; then
              echo "The first Admin already exists. Open the dashboard and sign in."
            else
              echo "Open the dashboard and enter the private LANCERLOGIN_SETUP_CODE to create the first Admin."
            fi
            if [ "$PAGES_BINDING_STATE" = "refused" ]; then
              echo ""
              echo "### Pages API binding not added"
              echo ""
              echo "Cloudflare did not add the Pages API binding to \`$INSTALLATION_SLUG-dashboard\` (HTTP $PAGES_BINDING_STATUS). The dashboard is deployed and works, but sign-in limits are shared by all dashboard visitors, so a busy team can see \"Too many sign-in attempts\". Check that the Cloudflare token has **Cloudflare Pages: Edit**, then run this workflow again with the operation \`resume\` and the same slug. The next release update also adds the binding."
            fi
            echo ""
            echo "### Environment variables for future updates"
            echo ""
            echo "One-click updates from the dashboard read these variables (the Upgrade LancerLogin web and Refresh web update credential workflows). This workflow's \`upgrade\` operation does not need them, and this workflow cannot set them. Add each one to the \`production\` environment in [Settings > Environments]($ENVIRONMENTS_URL)."
            echo ""
            echo "| Variable | Value |"
            echo "| --- | --- |"
            echo "| \`LANCERLOGIN_INSTALLATION_SLUG\` | \`$INSTALLATION_SLUG\` |"
            echo "| \`LANCERLOGIN_DATABASE_ID\` | \`$database_id\` |"
            echo "| \`LANCERLOGIN_API_URL\` | \`$API_URL\` |"
            if [ "$UPDATE_CREDENTIAL_STATE" != "configured" ]; then
              echo ""
              if [ "$UPDATE_CREDENTIAL_STATE" = "skipped" ]; then
                echo "### Dashboard update token not installed"
                echo ""
                echo "\`LANCERLOGIN_WEB_UPDATE_TOKEN\` is set but could not be used (\`$UPDATE_CREDENTIAL_REASON\`); the warning on this run gives the cause. The token is optional, so this $INPUT_OPERATION continued as if it were not set and did not install it. The dashboard keeps the token it already has, and **Settings > Updates > Setup status** shows whether that one has expired or been rejected; one-click updates stay off until a working token is installed. This workflow's \`upgrade\` operation keeps updating LancerLogin without a token; to use it instead, delete the secret, which also stops the warning. To turn one-click updates back on:"
              else
                echo "### Dashboard updates are not set up yet"
                echo ""
                echo "\`LANCERLOGIN_WEB_UPDATE_TOKEN\` is not set, so the dashboard cannot start updates. LancerLogin works without it. To set up dashboard updates:"
              fi
              echo ""
              echo "1. Create a [fine-grained personal access token](https://github.com/settings/personal-access-tokens/new) with access to only the repository \`$GITHUB_REPOSITORY\` and the repository permission **Actions: Read and write**. LancerLogin reads its expiration date from GitHub."
              echo "2. Store it as the environment secret \`LANCERLOGIN_WEB_UPDATE_TOKEN\` in the \`production\` environment in [Settings > Environments]($ENVIRONMENTS_URL)."
              echo "3. Set the environment variables above, then run [Refresh web update credential]($REFRESH_CREDENTIAL_WORKFLOW_URL)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Written here, not in a script, because this workflow can install a release older than this check. The policy file
      # it uses is the one the release step wrote before any release was checked out.
      - name: Verify that the installation answers on the new release
        shell: bash
        env:
          API_URL: ${{ steps.deploy-api.outputs.deployment-url }}
          DASHBOARD_URL: https://${{ inputs.installation_slug }}-dashboard.pages.dev
        run: |
          # Read-only. Polls the Worker's public /health, at the address the downgrade check read the installed release
          # from, and the same answer through the dashboard's /api proxy, until both report the release just deployed in
          # the ready mode. Deployments usually answer within seconds; the wait is bounded at two minutes.
          subdomain=$(cat .provision/workers-subdomain.txt 2>/dev/null || true)
          if printf '%s' "$subdomain" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            api_origin="https://$INSTALLATION_SLUG-api.$subdomain.workers.dev"
          else
            api_origin="${API_URL%/}"
          fi
          endpoints=("$api_origin/health" "$DASHBOARD_URL/api/health")
          wait_seconds=120
          interval=5
          deadline=$((SECONDS + wait_seconds))
          while :; do
            failed=""
            for url in "${endpoints[@]}"; do
              rm -f .provision/deployed-health.json
              code=$(curl --silent --proto '=https' --tlsv1.2 --max-time 10 --header 'Cache-Control: no-cache' \
                --output .provision/deployed-health.json --write-out '%{http_code}' "$url" 2>/dev/null) || code="${code:-000}"
              state="no_answer"
              if [ "$code" = "200" ]; then
                state=$(node "$RUNNER_TEMP/release-policy.cjs" deployed .provision/deployed-health.json "$RELEASE_TAG" 2>/dev/null) || state="no_answer"
              fi
              if [ "$state" != "ready" ]; then
                failed=$url
                break
              fi
            done
            if [ -z "$failed" ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              case "$INPUT_OPERATION" in upgrade) rerun=upgrade ;; *) rerun=resume ;; esac
              next="The deploy steps themselves completed. In the Cloudflare dashboard, open Workers & Pages and check the Worker $INSTALLATION_SLUG-api and the Pages project $INSTALLATION_SLUG-dashboard (their latest deployment and logs), then run this workflow again with the operation $rerun and the same slug. See https://isriah.github.io/LancerLogin/troubleshooting.html#install."
              case "$state" in
                release:*)
                  echo "::error title=installation_health_release_mismatch::$failed still reports LancerLogin release ${state#release:} instead of ${RELEASE_TAG#v} after $wait_seconds seconds, so an older or different deployment is still the one answering, not the release this run deployed. $next" ;;
                mode:*)
                  echo "::error title=installation_health_not_ready::$failed reports LancerLogin $RELEASE_TAG, but in the mode ${state#mode:} instead of ready after $wait_seconds seconds (unconfigured means the Worker has no D1 database binding). $next" ;;
                *)
                  echo "::error title=installation_health_no_answer::$failed did not answer with LancerLogin's health status within $wait_seconds seconds (last answer: HTTP $code). $next" ;;
              esac
              exit 1
            fi
            sleep "$interval"
          done
          echo "The Worker API and the dashboard's /api both answer as LancerLogin $RELEASE_TAG in the ready mode."
          {
            echo ""
            echo "### Health check passed"
            echo ""
            echo "The Worker API (\`$api_origin/health\`) and the dashboard (\`$DASHBOARD_URL/api/health\`) both answer as LancerLogin $RELEASE_TAG in the ready mode."
          } >> "$GITHUB_STEP_SUMMARY"
