name: Refresh web update credential
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lancerlogin-production-installation
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LANCERLOGIN_UPDATE_REPOSITORY: ${{ github.repository }}
      INSTALLATION_SLUG: ${{ vars.LANCERLOGIN_INSTALLATION_SLUG }}
      DATABASE_NAME: ${{ vars.LANCERLOGIN_DATABASE_NAME }}
      DATABASE_ID: ${{ vars.LANCERLOGIN_DATABASE_ID }}
      API_URL: ${{ vars.LANCERLOGIN_API_URL }}
      WEB_UPDATE_TOKEN_EXPIRES_AT: ${{ vars.WEB_UPDATE_TOKEN_EXPIRES_AT }}
      MODULE_SELECTION_TOKEN_EXPIRES_AT: ${{ vars.MODULE_SELECTION_TOKEN_EXPIRES_AT }}
      # Secrets are set only on the step that uses them, so npm ci and its dependency lifecycle scripts never see them.
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_SANITIZE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - run: npm ci --no-audit
      - name: Verify and upload only the fixed Worker dispatch and plugin selection credentials
        env:
          LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
          # Optional: separate Contents-write token for dashboard plugin management. See docs/MODULE-PLUGINS.md for its scope.
          LANCERLOGIN_MODULE_SELECTION_TOKEN: ${{ secrets.LANCERLOGIN_MODULE_SELECTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/refresh-web-update-credential.mjs
