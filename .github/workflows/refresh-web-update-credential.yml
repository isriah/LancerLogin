name: Refresh web update credential
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lancerlogin-production-installation
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LANCERLOGIN_UPDATE_REPOSITORY: ${{ github.repository }}
      INSTALLATION_SLUG: ${{ vars.LANCERLOGIN_INSTALLATION_SLUG }}
      DATABASE_NAME: ${{ vars.LANCERLOGIN_DATABASE_NAME }}
      DATABASE_ID: ${{ vars.LANCERLOGIN_DATABASE_ID }}
      API_URL: ${{ vars.LANCERLOGIN_API_URL }}
      # Token expiries are read from GitHub's response headers, never entered by hand.
      # Secrets are set only on the step that uses them, so npm ci and its dependency lifecycle scripts never see them.
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_SANITIZE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      # This repository's own copy of the refresh script stays at the version the repository was created from, because
      # web updates never change it. The installed release's script is used instead: the Worker's public /health reports
      # the release it runs, and its tag must exist in isriah/LancerLogin.
      - name: Find the installed LancerLogin release
        id: release
        shell: bash
        run: |
          tag=""
          sha=""
          version=$(node --input-type=module <<'EOF'
          const slug = process.env.INSTALLATION_SLUG ?? "";
          let url;
          try { url = new URL(process.env.API_URL ?? ""); } catch { process.exit(0); }
          if (url.protocol !== "https:" || url.pathname !== "/" || url.username || url.password || url.search || url.hash || !url.hostname.startsWith(`${slug}-api.`) || !url.hostname.endsWith(".workers.dev")) process.exit(0);
          try {
            const response = await fetch(new URL("/health", url), { redirect: "error", signal: AbortSignal.timeout(10_000) });
            const health = response.ok ? await response.json() : {};
            if (typeof health.releaseVersion === "string" && /^\d+\.\d+\.\d+(?:-beta\.\d+)?$/.test(health.releaseVersion)) process.stdout.write(health.releaseVersion);
          } catch {}
          EOF
          )
          if [ -n "$version" ]; then
            refs=$(git ls-remote --tags https://github.com/isriah/LancerLogin "refs/tags/v$version" "refs/tags/v$version^{}" || true)
            sha=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')
            [ -n "$sha" ] || sha=$(printf '%s\n' "$refs" | awk 'NF { print $1; exit }')
            if printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then tag="v$version"; else sha=""; fi
          fi
          if [ -n "$tag" ]; then
            echo "Running the refresh script from LancerLogin $tag, the release this installation runs."
            echo "dir=lancerlogin-release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=installed_release_unresolved::The installed LancerLogin release could not be read from LANCERLOGIN_API_URL/health, so this run uses this repository's own copy of the refresh script, which may be older. Check the production environment variable LANCERLOGIN_API_URL, or update this repository's workflow files from Settings > Updates."
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the installed release's scripts
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          repository: isriah/LancerLogin
          ref: ${{ steps.release.outputs.sha }}
          path: lancerlogin-release
          persist-credentials: false
      - name: Install the script's dependencies
        working-directory: ${{ steps.release.outputs.dir }}
        run: npm ci --no-audit
      - name: Verify and upload only the fixed Worker dispatch and plugin selection credentials
        working-directory: ${{ steps.release.outputs.dir }}
        env:
          LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
          # Optional: separate Contents-write token for dashboard plugin management. See docs/MODULE-PLUGINS.md for its scope.
          LANCERLOGIN_MODULE_SELECTION_TOKEN: ${{ secrets.LANCERLOGIN_MODULE_SELECTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/refresh-web-update-credential.mjs
