name: Refresh web update credential
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lancerlogin-production-installation
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LANCERLOGIN_UPDATE_REPOSITORY: ${{ github.repository }}
      INSTALLATION_SLUG: ${{ vars.LANCERLOGIN_INSTALLATION_SLUG }}
      DATABASE_ID: ${{ vars.LANCERLOGIN_DATABASE_ID }}
      API_URL: ${{ vars.LANCERLOGIN_API_URL }}
      LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
      WEB_UPDATE_TOKEN_EXPIRES_AT: ${{ vars.WEB_UPDATE_TOKEN_EXPIRES_AT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_SANITIZE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit
      - name: Verify and upload only the fixed Worker dispatch credential
        run: node scripts/refresh-web-update-credential.mjs
