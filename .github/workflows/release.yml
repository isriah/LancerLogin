name: Build community release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version=$(jq -r .version package.json)
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Require successful main-branch verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          successful_runs=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')
          test "$successful_runs" -gt 0 || {
            echo "The tagged commit must first pass the Verify workflow on main." >&2
            exit 1
          }
      - name: Package architecture-neutral kiosk service
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/kiosk/src release/kiosk/scripts release/kiosk/systemd release/kiosk/polkit release/artifacts
          cp apps/kiosk/src/service.mjs apps/kiosk/src/ui.mjs apps/kiosk/src/cloud-client.mjs apps/kiosk/src/file-queue.mjs apps/kiosk/src/mapping-store.mjs apps/kiosk/src/r503.mjs apps/kiosk/src/serial-transport.mjs apps/kiosk/src/pair-cli.mjs apps/kiosk/src/pairing-key.mjs apps/kiosk/src/kiosk-states.mjs apps/kiosk/src/kiosk-presentation.mjs apps/kiosk/src/scanner.mjs apps/kiosk/src/network-manager.mjs apps/kiosk/src/network-pin.mjs apps/kiosk/src/network-ui.mjs apps/kiosk/src/maintenance-ui.mjs apps/kiosk/src/recovery-ui.mjs release/kiosk/src/
          cp apps/kiosk/scripts/lancerlogin-install-release.sh release/kiosk/scripts/
          cp apps/kiosk/systemd/lancerlogin-kiosk.service apps/kiosk/systemd/lancerlogin-update.service release/kiosk/systemd/
          cp apps/kiosk/polkit/49-lancerlogin-network.rules apps/kiosk/polkit/49-lancerlogin-recovery.rules apps/kiosk/polkit/49-lancerlogin-update.rules release/kiosk/polkit/
          for arch in arm64 armv7; do
            archive="lancerlogin-kiosk-${version}-linux-${arch}.tar.gz"
            tar --create --gzip --file "release/artifacts/$archive" --directory release/kiosk .
            (cd release/artifacts && sha256sum "$archive" > "$archive.sha256")
          done
          sed "s/^VERSION=.*/VERSION=\"\${LANCERLOGIN_VERSION:-${version}}\"/" apps/kiosk/scripts/install-lancerlogin.sh > release/artifacts/install-lancerlogin.sh
          chmod 0755 release/artifacts/install-lancerlogin.sh
          (cd release/artifacts && sha256sum install-lancerlogin.sh > install-lancerlogin.sh.sha256)
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes_file" || { echo "Missing required meaningful patch notes: $notes_file" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" release/artifacts/* --verify-tag --notes-file "$notes_file" --title "LancerLogin $GITHUB_REF_NAME"
