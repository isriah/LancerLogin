name: "Maintainers: Build LancerLogin release"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical release tag with successful trusted-branch Verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: lancerlogin-release-packaging
  cancel-in-progress: false

jobs:
  package-release:
    if: >-
      github.repository == 'isriah/LancerLogin' && github.event.repository.private == false &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the reviewed publication tools
        uses: actions/checkout@v7
        with:
          path: publication-control
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1 }
      - name: Require successful source-branch verification for this exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node publication-control/scripts/release-publication.mjs resolve "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Check out the exact verified release source
        uses: actions/checkout@v7
        with:
          repository: isriah/LancerLogin
          ref: ${{ steps.source.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Package and validate both kiosk release archives
        run: |
          mkdir -p release
          sudo "$(command -v node)" release-source/scripts/package-kiosk.mjs release/artifacts --require-unprivileged
      - name: Bind the verified assets and notes to their source and run
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node publication-control/scripts/release-publication.mjs bundle "$RELEASE_TAG" "$SOURCE_SHA" release-source release
      - name: Preserve the verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: lancerlogin-release-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Explain the maintainer publication step
        run: |
          printf 'Run node scripts/release-publication.mjs publish %s %s --publish from the reviewed publication-tools checkout with your existing GitHub CLI login. No release has been published by this workflow.\n' "$RELEASE_TAG" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
