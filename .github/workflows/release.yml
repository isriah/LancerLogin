name: Build community release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the tag to match the package version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package architecture-neutral kiosk service
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/kiosk/src release/kiosk/systemd release/artifacts
          cp apps/kiosk/src/service.mjs apps/kiosk/src/ui.mjs apps/kiosk/src/cloud-client.mjs apps/kiosk/src/file-queue.mjs apps/kiosk/src/mapping-store.mjs apps/kiosk/src/r503.mjs apps/kiosk/src/serial-transport.mjs apps/kiosk/src/pair-cli.mjs release/kiosk/src/
          cp apps/kiosk/systemd/lancerlogin-kiosk.service release/kiosk/systemd/
          for arch in arm64 armv7; do
            archive="lancerlogin-kiosk-${version}-linux-${arch}.tar.gz"
            tar --create --gzip --file "release/artifacts/$archive" --directory release/kiosk .
            (cd release/artifacts && sha256sum "$archive" > "$archive.sha256")
          done
          sed "s/^VERSION=.*/VERSION=\"\${LANCERLOGIN_VERSION:-${version}}\"/" apps/kiosk/scripts/install-lancerlogin.sh > release/artifacts/install-lancerlogin.sh
          chmod 0755 release/artifacts/install-lancerlogin.sh
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/artifacts/* --verify-tag --generate-notes --title "LancerLogin $GITHUB_REF_NAME"
