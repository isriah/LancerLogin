name: Upgrade LancerLogin web (update channels v2)
run-name: LancerLogin web update ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable request created by the application
        required: true
        type: string
      release_tag:
        description: Official release pinned under the installation's selected update track
        required: true
        type: string
      release_sha:
        description: Exact official source commit pinned by the application
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lancerlogin-production-installation
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      UPDATE_REPOSITORY: ${{ github.repository }}
      REQUEST_ID: ${{ inputs.request_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      EXECUTOR_RUN_ID: ${{ github.run_id }}
      INSTALLATION_SLUG: ${{ vars.LANCERLOGIN_INSTALLATION_SLUG }}
      DATABASE_NAME: ${{ vars.LANCERLOGIN_DATABASE_NAME }}
      DATABASE_ID: ${{ vars.LANCERLOGIN_DATABASE_ID }}
      API_URL: ${{ vars.LANCERLOGIN_API_URL }}
      # Optional Worker placement hint such as aws:us-east-1; unset deploys with Smart Placement.
      LANCERLOGIN_WORKER_PLACEMENT_REGION: ${{ vars.LANCERLOGIN_WORKER_PLACEMENT_REGION }}
      # Secrets are not set here. Only the final step receives them, so the validation step and npm ci (with its
      # dependency lifecycle scripts) never run with Cloudflare or plugin credentials in their environment.
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_SANITIZE: "true"
    steps:
      - name: Check out the trusted private deployment controller
        uses: actions/checkout@v7
        with:
          path: deployment-control
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Validate fixed resources and official release before checkout
        # No secrets: --validate checks the request, fixed resources and the public release only.
        run: node deployment-control/scripts/run-web-upgrade.mjs --validate
      - name: Check out the exact official release commit
        uses: actions/checkout@v7
        with:
          repository: isriah/LancerLogin
          ref: ${{ inputs.release_sha }}
          path: lancerlogin-source
          persist-credentials: false
      - name: Install exact source dependencies
        working-directory: lancerlogin-source
        run: npm ci --no-audit
      - name: Claim, checkpoint, upgrade and verify retained installation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The runner composes the release's official modules and this repository's lancerlogin.modules.json in preflight.
          # Optional read-only token for private plugin repositories in lancerlogin.modules.json.
          LANCERLOGIN_PLUGIN_TOKEN: ${{ secrets.LANCERLOGIN_PLUGIN_TOKEN }}
          # Read only for its expiry, from GitHub's response header, before claim. It never reaches Wrangler or plugins.
          LANCERLOGIN_WEB_UPDATE_TOKEN: ${{ secrets.LANCERLOGIN_WEB_UPDATE_TOKEN }}
        run: node lancerlogin-source/scripts/run-web-upgrade.mjs
